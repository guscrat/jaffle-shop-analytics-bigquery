[project]
name = "dbt"
version = "0.1.0"
description = "This is a python based dbt and bigquery project training using jaffle-shop public dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbt-bigquery>=1.12.0",
    "dbt-core>=1.11.11",
    "duckdb>=1.5.5",
    "google-cloud-bigquery>=3.45.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
]
