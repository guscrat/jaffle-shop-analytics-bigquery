jaffle_shop: # Nome do perfil definido no dbt_project.yml
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT') }}" # ID do projeto no GCP
      dataset: "{{ env_var('GCP_DATASET') }}" # Dataset padrão (schema)
      threads: 4
      timeout_seconds: 300
      location: US # Localização do dataset
      keyfile: "{{ env_var('GCP_SA_KEYFILE') }}"
